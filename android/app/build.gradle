import org.gradle.api.GradleException

plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
} else {
    logger.warn("google-services.json is missing; Firebase Phone Auth will be unavailable.")
}

// =========================
// Local properties
// =========================
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')

if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define flutter.sdk in local.properties")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

// =========================
// Keystore
// =========================
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseStoreFile = keystoreProperties['storeFile']
        ? file(keystoreProperties['storeFile'])
        : null
def hasReleaseKeystore = releaseStoreFile != null && releaseStoreFile.exists()

android {

    namespace "com.scores11.app"

// ✅ UPDATED compileSdk (36 required by AndroidX dependencies)
    compileSdk 36

    // ✅ UPDATED NDK (27+ required by plugins)
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    defaultConfig {

        applicationId "com.scores11.app"

        // ✅ Stable minimum sdk
        minSdkVersion 24

targetSdk 36

        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        multiDexEnabled true
    }

    signingConfigs {

        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile releaseStoreFile
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {

        debug {
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }

        profile {
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }

        release {

            signingConfig signingConfigs.release

            // ✅ IMPORTANT: Disable minification for stable release
            minifyEnabled false
            shrinkResources false
            debuggable false

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.txt',
                    'META-INF/license.txt',
                    'META-INF/NOTICE',
                    'META-INF/NOTICE.txt',
                    'META-INF/notice.txt',
                    'META-INF/ASL2.0'
            ]
        }
    }
}

// =========================
// Flutter
// =========================
flutter {
    source '../..'
}

// =========================
// Dependency conflict fix
// =========================
configurations.all {

resolutionStrategy {

        // ✅ UPDATED for compileSdk 36 compatibility
        force 'androidx.core:core:1.17.0'
        force 'androidx.activity:activity:1.12.4'
        force 'androidx.activity:activity-ktx:1.12.4'
        force 'androidx.fragment:fragment:1.8.7'
        force 'androidx.versionedparcelable:versionedparcelable:1.1.1'
    }
}

dependencies {

// ✅ STABLE Kotlin (1.9.22 is production-ready)
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"

    implementation 'androidx.multidex:multidex:2.0.1'

implementation 'androidx.core:core-ktx:1.17.0'

// ✅ AndroidX Activity (required for compileSdk 36)
    implementation 'androidx.activity:activity:1.12.4'
    implementation 'androidx.activity:activity-ktx:1.12.4'
    
    // ✅ AndroidX Fragment (required for compileSdk 36)
    implementation 'androidx.fragment:fragment:1.8.7'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // ✅ Play Core
    implementation 'com.google.android.play:core:1.10.3'
}
