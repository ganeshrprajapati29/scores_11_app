# This machine has ~8GB total RAM (4 cores). -Xmx8G (plus 4G reserved
# metaspace) left no room for the OS or for parallel Kotlin compile
# workers, so the JVM crashed with a native OOM mid-compile (see
# android/hs_err_pid*.log - "Out of Memory Error (arena.cpp:168)") on
# whichever plugin modules happened to be compiling in parallel. Even at
# -Xmx2G, running several worker processes at once (compressReleaseAssets,
# Kotlin daemons, etc.) still exhausted Windows' resource limits
# ("Insufficient system resources exist to complete the requested
# service"), so everything is serialized (workers.max=1, parallel=false)
# to keep peak memory/handle usage as low as possible on this hardware.
# IMPORTANT: only run one Gradle/Flutter build at a time on this machine -
# two concurrent builds will exhaust the 8GB RAM between them regardless
# of these settings.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.vfs.watch=false

# The App Insights "VCS info" task (extractReleaseVersionControlInfo) needs
# an Android Studio class (com/android/tools/idea/insights/proto/BuildInfo)
# that isn't on the classpath when Gradle is invoked outside Studio (e.g.
# via `flutter build`), so it fails with NoClassDefFoundError. Not needed
# for a release APK build - disabled.
android.enableVcsInfo=false
android.useAndroidX=true
android.enableJetifier=true

# ✅ CRITICAL: Enable multi-dex for better compatibility
android.enableMultiDex=true

# ✅ Disable build features that cause issues in release mode
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=true
android.defaults.buildfeatures.shaders=false

# ✅ Use stable Kotlin
kotlin.stdlib.default.dependency=true
