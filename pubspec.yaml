name: Scores11
description: "Cric11 - Play Cricket. Win Glory."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.1
  
  # Network
  dio: ^5.4.0
  socket_io_client: ^2.0.3+1
  
  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  
  # UI
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  
  # Maps & Location
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  
  # Utils
  intl: ^0.19.0
  connectivity_plus: ^5.0.2
  image_picker: ^1.0.7
  
  # Firebase (optional)
  firebase_core: ^2.25.4
  firebase_messaging: ^14.7.10
  
  # QR Code & Sharing
  qr_flutter: ^4.1.0
  share_plus: ^7.2.1
  
  # Data Classes
  equatable: ^2.0.5
  flutter_screenutil: ^5.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

# App icon configuration (run: flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"
