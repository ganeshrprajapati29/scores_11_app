name: scores11

description: "Scores11 - Play Cricket. Win Glory."

publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:

  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # =========================
  # STATE MANAGEMENT
  # =========================
  provider: ^6.1.2

  # =========================
  # NETWORK
  # =========================
  dio: ^5.4.3+1
  socket_io_client: ^2.0.3+1

  # =========================
  # STORAGE
  # =========================
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # =========================
  # UI
  # =========================
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  flutter_screenutil: ^5.9.3

  # =========================
  # MAPS & LOCATION
  # =========================
  google_maps_flutter: ^2.6.1
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # =========================
  # UTILS
  # =========================
  intl: ^0.19.0
  connectivity_plus: ^6.0.3
  logger: ^2.2.0
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.10
  url_launcher: ^6.3.1

  # =========================
  # FIREBASE
  # =========================
  firebase_core: ^2.31.1
  firebase_messaging: ^14.9.4

  # =========================
  # QR & SHARE
  # =========================
  qr_flutter: ^4.1.0
  share_plus: ^9.0.0

  # =========================
  # MODELS
  # =========================
  equatable: ^2.0.5
  json_annotation: ^4.9.0

  # =========================
  # VIDEO PLAYER
  # =========================
  video_player: ^2.8.6
  chewie: ^1.8.1
  youtube_player_flutter: ^9.0.4
  camera: ^0.10.5+9

  # =========================
  # PERMISSIONS
  # =========================
  permission_handler: ^11.3.1
  haishin_kit: 0.16.0
  wakelock_plus: ^1.5.2

dev_dependencies:

  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.2

  flutter_launcher_icons: ^0.13.1

  build_runner: ^2.4.9

  json_serializable: ^6.8.0

flutter:

  uses-material-design: true

  assets:
    - assets/login Auth cricket illustration.png
    - score 11/Login, Register, OTP 1080 x 720 PNG.png
    - score 11/Splash Screen 1080 x 2400.png
    - score 11/Home Dashboard without text.png
    - score 11/Create Match Team 1080 x 420 PNG.png
    - score 11/Live Match Card 1024 x 576 PNG.png
    - score 11/Live Control 1080 x 520.png
    - score 11/Upcoming Match Card  1024 x 576 PNG.png
    - score 11/Match Detail Header 1080 x 520.png
    - score 11/Tournament Page banner.png
    - score 11/Store.png
    - score 11/Wallet.png
    - score 11/Community  Blog without trxt.png
    - score 11/Player Profile cover page.png
    - score 11/Player Profile avatr circle page.png
    - score 11/Team  cover page.png
    - score 11/Team Profile logo.png
    - score 11/Empty States 2.png
    - score 11/Empty States 4.png
    - score 11/Empty States 5.png
    - score 11/Empty States 6.png
    - score 11/Leaderboard without text.png
    - assets/images/
    - assets/images/auth/
    - assets/images/teams/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#1E88E5"
  adaptive_icon_foreground: "assets/images/logo.png"
